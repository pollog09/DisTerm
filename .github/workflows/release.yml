name: Release

# Build, code-sign, and notarize the macOS app, build the Linux packages, and attach them to a
# GitHub Release. Run by hand only, against a version tag: pick the tag as the ref when dispatching,
# since the jobs name the release after GITHUB_REF_NAME. Nothing here publishes a mac or Linux feed
# or promotes a release to "latest".
#
# Windows is not here: release-windows.yml builds it on the tag push and publishes that release as
# the latest, which is the Windows update feed. Dispatching this for a tag that is already published
# is not safe as written: release-linux's softprops step passes `prerelease: true` to an existing
# release, which would drop it from /releases/latest and point the feed back at the previous version.
on:
  workflow_dispatch:

permissions:
  contents: write # allow creating the GitHub Release (canonical artifact store)

jobs:
  release-mac:
    # Runs on a SELF-HOSTED Apple Silicon Mac (no GitHub macOS-runner minutes — those are billed
    # 10× and a slow notarization poll can burn hundreds). Everything else is identical: the runner
    # signs + notarizes + publishes the GitHub Release. The runner checks out into its own _work dir, so it never touches the dev repo.
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          # No `cache: npm` here on purpose: this is the self-hosted Mac runner, whose ~/.npm
          # is already warm across runs. setup-node's post-run cache SAVE step (a tarball upload
          # to GitHub's cache service) bought nothing but failed the whole release-mac job on a
          # network blip — after every asset had uploaded — which skipped the publish gate and
          # stranded v0.2.23 as a prerelease. The ephemeral Linux runner below keeps its cache.

      # The free-tier project limit's embedded deadline (PROJECT_LIMIT_DEADLINE_MS) must be bumped
      # in every release before the flip, or DO_NOT_TRACK users are gated before anyone else. This
      # refuses a tag whose deadline is under 30 days away (until it is frozen at the flip). Plain
      # node, no npm ci, so a refused release fails in seconds. It is the FIRST step that runs in
      # every build job (mac, linux, and win in release-windows.yml): those jobs do not wait for each
      # other and each creates the release on its first upload, so a refused tag must stop all three
      # before they build.
      # See docs/project-limit.md.
      - name: Project-limit deadline guard
        run: node scripts/check-project-limit-deadline.mjs

      # caffeinate on EVERY long-running step in this job, not just build+upload: the Air
      # sleeping during npm ci or the tmux compile cancels the step just the same (the
      # v0.3.1 attempt died mid tmux build). -dims only blocks idle sleep — a closed lid
      # still sleeps the machine — but it removes the "opened the lid, walked away" window.
      - name: Install dependencies
        run: caffeinate -dims npm ci

      # sharp's binary is an optional dependency per platform, so `npm ci` on this ARM64 runner
      # skips the x64 one, and the Intel app would ship with no working project icon upload.
      # Versions come from the lockfile so they cannot drift. --no-save leaves the lockfile alone,
      # --force allows the other CPU, and --ignore-scripts skips a second native rebuild.
      - name: Add the x64 sharp binary for the Intel build
        run: |
          sharp_version=$(node -p "require('./package-lock.json').packages['node_modules/@img/sharp-darwin-x64'].version")
          libvips_version=$(node -p "require('./package-lock.json').packages['node_modules/@img/sharp-libvips-darwin-x64'].version")
          caffeinate -dims npm install --no-save --force --ignore-scripts "@img/sharp-darwin-x64@$sharp_version" "@img/sharp-libvips-darwin-x64@$libvips_version"

      # The bundled tmux (resources/bin/tmux → <app>/Contents/Resources/bin/tmux via the mac
      # extraResources entry). Without a tmux on the machine the app silently degrades to plain
      # shells — no persistence across restarts, no mobile attach, and a park/dispose kills the
      # agent CLI instead of detaching a client (issue #126). Shipping one removes that for the
      # tmux-less; the SYSTEM tmux still takes precedence at runtime (see findTmux).
      #
      # A SEPARATE STEP, before electron-builder, on purpose: a missing extraResources source is
      # only a WARNING to electron-builder, so a failure folded into the release command could
      # publish a DMG with no tmux in it and nobody would notice. Here a build failure fails the
      # job. Idempotent — a rerun with the binary already present is a no-op, so the retry loop in
      # the next step costs nothing.
      #
      # RUNNER TOOLCHAIN: the Xcode command line tools and nothing else — curl, cc, make, ar, yacc,
      # lipo, strip, otool, nm. Explicitly NOT needed: cmake (utf8proc is built through its plain
      # Makefile, not its CMakeLists), autoconf (release tarballs ship a generated `configure`, and
      # each arch is extracted fresh so no maintainer rule fires), pkg-config (deliberately
      # disabled — a Homebrew .pc file would link the bundle to dylibs users don't have), Homebrew,
      # Rosetta (the cross slice is configured with --host, so no test binary is ever executed) and
      # npm packages (node stdlib only).
      - name: Build bundled tmux (universal, static libevent + utf8proc)
        run: caffeinate -dims node scripts/build-tmux.mjs

      # ELECTRON-BUILDER FLOOR — 26.16.1, and the `^26.16.1` range in package.json is what keeps
      # it. Up to and including 26.16.0, createKeychain generated a random keychain password but
      # then handed `security set-key-partition-list` the P12 password instead
      # (app-builder-lib/out/codeSign/macCodeSign.js: random at :137, wrong one passed at :168).
      # macOS tolerated the mismatch for years; the runner's upgrade to Darwin 27 stopped
      # tolerating it, and every signing run died on
      #   security: SecKeychainUnlock: The user name or passphrase you entered is not correct.
      # — which reads exactly like a bad CSC_* secret and is not one. 26.16.1 threads the real
      # keychain password through. Do not drop below it; note npm's `latest` dist-tag still
      # points at 26.15.3, so `npm i electron-builder@latest` installs the broken one.
      - name: Build, sign & notarize
        run: |
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/notary-key.p8"
          # Apple's notarization can take a long time, and @electron/notarize has no retry: a single
          # transient network blip while polling appstoreconnect (NSURLError -1009) fails the whole
          # build even though the submission gets Accepted. Retry the release up to 3 times so one
          # blip during a long poll doesn't sink the release.
          # caffeinate: the runner is a MacBook Air, and idle sleep mid-notarization disconnects
          # the runner — GitHub then marks the job "cancelled" (bit v0.2.16 and v0.2.18). Assert
          # no-sleep for exactly as long as the release command runs.
          n=1
          until caffeinate -dims npm run release:mac; do
            if [ "$n" -ge 3 ]; then
              echo "::error::release failed after $n attempts"
              exit 1
            fi
            echo "::warning::release attempt $n failed (likely transient notarization network error); retrying in 60s…"
            n=$((n + 1))
            sleep 60
          done
        env:
          # Developer ID Application cert, base64-encoded .p12 + its password.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Apple notarization via App Store Connect API key: the .p8 is stored base64-encoded in
          # a secret, decoded to a file at runtime, and its path handed to electron-builder.
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Before anything is published. A missing optional package is not an electron-builder error,
      # so without this an Intel app with no sharp binary would ship without anyone noticing.
      - name: Verify the Intel app has its sharp binary
        run: |
          unpacked="dist/mac/DisTerm.app/Contents/Resources/app.asar.unpacked/node_modules/@img"
          for pkg in sharp-darwin-x64 sharp-libvips-darwin-x64; do
            if [ ! -f "$unpacked/$pkg/package.json" ]; then
              echo "::error::$pkg is missing from the Intel app ($unpacked)"
              exit 1
            fi
          done

      # NOTE: there is deliberately no actions/upload-artifact step. Each release is ~800 MB of
      # DMGs + zips, and Actions artifact storage is a small, billed quota that those copies filled
      # up (the release then failed with "Artifact storage quota has been hit"). The GitHub Release
      # below is the canonical store — it does not consume that quota — so the extra 90-day copy
      # bought nothing. Don't add it back.

      # Canonical copy of every release.
      #
      # Shell + `gh release upload --clobber` instead of softprops: uploading ~800 MB from the
      # self-hosted runner hit a mid-upload `write EPIPE` (v0.2.17) that softprops cannot retry,
      # leaving latest-mac.yml pointing at binaries that were never uploaded. --clobber makes
      # every retry idempotent, so a half-uploaded attempt heals on the next one.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the Air awake for THIS step too. caffeinate wrapped only build+notarize; an
          # ~800MB upload is long enough for idle sleep to disconnect the runner mid-transfer,
          # which cancels the step (v0.2.25) — and a cancel, unlike an error, the retry loop
          # below can't catch. `-w $$` ties the assertion to this shell's lifetime.
          caffeinate -dims -w $$ &
          tag="${GITHUB_REF_NAME}"
          # The linux job may already have created the release for this tag; tolerate the race.
          # Created as PRERELEASE: nothing in this workflow promotes it.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --verify-tag --prerelease --notes "" || true
          # No build.publish in package.json, so electron-builder may write no yml or blockmap at all.
          shopt -s nullglob
          n=1
          until gh release upload "$tag" dist/*.dmg dist/*.zip dist/*.yml dist/*.blockmap --clobber --repo "$GITHUB_REPOSITORY"; do
            if [ "$n" -ge 5 ]; then
              echo "::error::asset upload failed after $n attempts"
              exit 1
            fi
            echo "::warning::asset upload attempt $n failed (transient network?); retrying in 30s…"
            n=$((n + 1))
            sleep 30
          done


  # Linux build: unsigned, so it runs on a plain GitHub runner (fast + free tier), in
  # parallel with the self-hosted mac job — it must never queue behind notarization.
  # Publishes AppImage + deb + rpm to the SAME tag's GitHub Release.
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Same guard as release-mac (see the comment there): first, so a refused tag uploads nothing.
      - name: Project-limit deadline guard
        run: node scripts/check-project-limit-deadline.mjs

      # electron-builder ships its own fpm, but the rpm target shells out to the system
      # rpmbuild ("Need executable 'rpmbuild' to convert dir to rpm"). Installed explicitly
      # rather than relying on whatever the runner image happens to carry.
      - name: Install rpmbuild
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Build Linux packages
        run: |
          npm run make-icon
          npm run build
          npx electron-builder --linux --publish never

      # Both jobs target the release for the same tag; softprops updates an existing
      # release rather than failing, so mac/linux artifact sets merge. (A same-instant
      # creation race is theoretically possible — rerunning the failed job resolves it.)
      # prerelease: nothing in this workflow promotes it.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  # Writes the release notes once the mac and linux jobs uploaded their assets.
  publish:
    runs-on: ubuntu-latest
    needs: [release-mac, release-linux]
    # A job-level block replaces the workflow's, so contents: write is restated. issues: read lets
    # the release-notes generator look up the PRs labelled `no-release-notes` (labels live on the
    # issues API); without it that lookup fails and the notes fall back to the plain commit list.
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags — notes diff against the previous release tag

      # Release notes, in two layers (issue #841).
      #
      #   Layer 1  scripts/release-notes.mjs asks GitHub's own generator for the PR-resolved
      #            list (PR number, PR title, author) and regroups it into New / Improved /
      #            Fixed, with test/refactor/chore/ci/build collapsed at the bottom — kept, not
      #            deleted. Every entry links its PR, and any issue its title names. A PR
      #            labelled `no-release-notes` is left out entirely (docs/release-notes/README.md).
      #   Layer 2  docs/release-notes/<TAG>.md, a hand-written Highlights block reviewed in the
      #            release PR, placed at the top. ABSENT FILE ⇒ THE GROUPED LIST ALONE. No
      #            release is ever blocked waiting for prose, and nobody has to be in the loop.
      #
      # DEGRADES, NEVER FAILS: if the generator throws for any reason (gh api down, a body
      # shape we do not parse, a missing node), the step falls back to the plain `git log` list
      # this release used to publish — or to the compare link alone when a `no-release-notes` PR
      # is in the range or the label lookup does not answer. A release that cannot publish
      # because prose generation broke would be strictly worse than the list we are replacing.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          # The range starts at the last release USERS ACTUALLY GOT, not at the last tag. A
          # platform job can fail — v0.3.8's mac job did, after the signing runner's OS upgrade —
          # and that tag then stays a prerelease forever: never promoted, its notes never
          # generated. Diffing the next release against it would publish a changelog containing
          # only the handful of commits since, silently burying everything the stranded tag was
          # carrying. /releases/latest excludes prereleases, which is exactly the question being
          # asked, and this step runs BEFORE the promote below, so it still names the PREVIOUS
          # release. Falls back to the last tag when there is no published release yet, and when
          # a rerun on an already-promoted tag would otherwise diff that tag against itself.
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          if [ -z "$prev" ] || [ "$prev" = "$tag" ]; then
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          fi
          if [ -n "$prev" ]; then range="${prev}..${tag}"; else range="${tag}"; fi
          if ! node scripts/release-notes.mjs --tag "$tag" --prev "$prev" \
                 --repo "$GITHUB_REPOSITORY" --out notes.md; then
            echo "::warning::structured release notes failed; falling back to the plain commit list"
            # The plain list is commit subjects, and git knows nothing about the `no-release-notes`
            # label — the fallback would publish exactly what the label keeps out. So the list is
            # printed only when the label lookup ANSWERS and no labelled PR was merged in this
            # range; otherwise the notes are the compare link alone. A failed lookup is not "no
            # labelled PRs".
            withheld=yes
            if labelled=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues?labels=no-release-notes&state=all&per_page=100" \
                            --jq '.[] | select(.pull_request) | .number' 2>/dev/null); then
              withheld=no
              subjects=$(git log --format='%s' "$range")
              for n in $labelled; do
                if grep -qE "^Merge pull request #${n} |\(#${n}\)\$" <<<"$subjects"; then withheld=yes; break; fi
              done
            fi
            if [ -n "$prev" ]; then link="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            else link="https://github.com/${GITHUB_REPOSITORY}/commits/${tag}"; fi
            {
              echo "## Changes${prev:+ since ${prev}}"
              if [ "$withheld" = yes ]; then
                echo "Full list of changes: ${link}"
              else
                git log --no-merges --format='- %s' "$range" | grep -vE '^- chore\(release\)' | head -60
                total=$(git log --no-merges --format='- %s' "$range" | grep -cvE '^- chore\(release\)' || true)
                if [ "${total:-0}" -gt 60 ]; then echo "- …and $((total - 60)) more commits"; fi
              fi
            } > notes.md
          fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
